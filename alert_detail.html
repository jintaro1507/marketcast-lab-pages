<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/img/favicon-48.png" sizes="48x48">
<link rel="icon" type="image/png" href="assets/img/favicon-512.png" sizes="512x512">
<title>Marketcast Alert ｜ Marketcast Lab</title>
<meta name="robots" content="noindex,follow">
<style>
  :root{
    --paper:#F2EFE8; --paper-deep:#E8E3D7; --ink:#1C1A16; --ink-soft:#5B564B;
    --line-rule:#cfc7b6;
    --surface-card:#FBFAF7;
    --shadow-card:0 1px 2px rgba(28,26,22,.05), 0 2px 8px rgba(28,26,22,.04);
    --observed:#38456B; --analysis:#8A3B2E;
    --display:"Shippori Mincho","Noto Serif JP",serif;
    --body:"Zen Kaku Gothic New","Noto Sans JP",sans-serif;
    --mono:"JetBrains Mono","Courier New",monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow-x:hidden;}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.85;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}

  .strip{background:var(--ink);color:var(--paper);font-size:11.5px;padding:8px 5vw;line-height:1.6;}
  header{border-bottom:1px solid var(--line-rule);padding:14px 5vw;display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  .brand{font-family:var(--display);font-size:18px;letter-spacing:0.04em;display:flex;align-items:baseline;gap:8px;}
  .brand .mark{font-family:var(--mono);font-size:10px;color:var(--ink-soft);border:1px solid var(--line-rule);padding:2px 6px;border-radius:2px;}
  .home-link{font-size:12.5px;color:var(--ink-soft);border-bottom:1px solid var(--line-rule);min-height:44px;display:inline-flex;align-items:center;}

  main{padding:0 5vw 60px;max-width:720px;margin:0 auto;}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-soft);padding-top:26px;}
  h1{font-family:var(--display);font-size:clamp(20px,5vw,27px);margin:8px 0 0;line-height:1.5;}
  .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:10px;}
  .badge{font-family:var(--mono);font-size:10px;letter-spacing:0.06em;border:1px solid var(--line-rule);
         padding:2px 7px;border-radius:2px;color:var(--ink-soft);}
  .time{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);}
  .lead{font-size:14px;color:var(--ink-soft);margin:12px 0 0;max-width:62ch;line-height:1.9;}
  .back-link{display:inline-flex;align-items:center;min-height:44px;font-size:13px;color:var(--ink-soft);border-bottom:1px solid var(--line-rule);margin-top:22px;}
  .back-link:hover{color:var(--ink);}
  .sec-label{font-family:var(--mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-soft);margin-top:30px;}

  .what{font-size:15px;line-height:1.9;margin:14px 0 0;}

  .observed{margin-top:12px;display:flex;flex-direction:column;gap:10px;}
  .obs-item{border-left:3px solid var(--observed);background:#fff;border:1px solid var(--line-rule);
            border-left:3px solid var(--observed);border-radius:8px;padding:13px 15px;}
  .obs-item b{font-size:14px;display:block;}
  .obs-item .val{font-size:14.5px;margin-top:5px;display:block;}
  .obs-item .src{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:7px;}

  .analysis-note{font-size:12px;color:var(--ink-soft);margin-top:12px;line-height:1.8;}
  .asset-row{border-left:3px solid var(--analysis);padding:11px 0 11px 14px;margin-top:10px;}
  .asset-row b{font-size:13.5px;display:block;}
  .asset-row p{font-size:13px;color:var(--ink-soft);margin:5px 0 0;line-height:1.85;}

  .why{font-size:13.5px;color:var(--ink-soft);line-height:1.9;margin:12px 0 0;
       border:1px solid var(--line-rule);background:var(--paper-deep);border-radius:8px;padding:14px 16px;}

  .links-list{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .link-card{border:1px solid var(--line-rule);background:var(--surface-card);border-radius:8px;padding:14px 15px;min-height:44px;}
  .link-card:hover{border-color:var(--ink-soft);}
  .link-card b{font-family:var(--display);font-size:14.5px;font-weight:400;display:block;}
  .link-card span{font-size:12.5px;color:var(--ink-soft);display:block;margin-top:4px;}

  .disclaimer{font-size:12px;color:var(--ink-soft);margin-top:28px;line-height:1.85;padding-top:14px;border-top:1px dashed var(--line-rule);}

  .gate{margin-top:26px;border:1px solid var(--line-rule);background:var(--paper-deep);border-radius:8px;padding:22px 22px 24px;}
  .gate h2{font-family:var(--display);font-size:19px;margin:0 0 10px;font-weight:400;}
  .gate p{font-size:14px;color:var(--ink-soft);margin:0 0 14px;line-height:1.9;}
  .gate-links a{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;background:var(--ink);color:var(--paper);
                border-radius:2px;font-size:13.5px;margin-right:10px;margin-top:6px;}
  .gate-links a.secondary{background:transparent;color:var(--ink);border:1px solid var(--line-rule);}

  .legal-links{display:flex;flex-wrap:wrap;gap:8px 20px;padding:14px 5vw 40px;margin-top:6px;border-top:1px solid var(--line-rule);max-width:720px;margin-left:auto;margin-right:auto;}
  .legal-links a{font-size:12.5px;color:var(--ink-soft);border-bottom:1px solid var(--line-rule);min-height:44px;display:inline-flex;align-items:center;}
  .legal-links a:hover{color:var(--ink);border-color:var(--ink-soft);}
</style>
<script src="assets/js/membership-flag.js"></script>
<script src="assets/js/analytics.js"></script>
</head>
<body>

<div class="strip"><b>本サイトは情報提供・教育目的です。</b>個別の投資助言ではありません。特定の取引・銘柄・商品を推奨するものではありません。</div>

<header>
  <div class="brand"><a href="index.html">Marketcast Lab</a> <span class="mark">観測所</span></div>
  <a class="home-link" href="index.html">トップへ</a>
</header>

<main id="app"><p class="lead" style="padding-top:30px;">読み込み中…</p></main>

<nav class="legal-links" aria-label="ご利用にあたって">
  <a href="tokushoho.html">特定商取引法に基づく表記</a>
  <a href="privacy.html">プライバシーポリシー</a>
  <a href="disclaimer.html">免責事項</a>
</nav>

<script type="module">
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function track(name, props) {
  try { if (typeof trackProductEvent === 'function') trackProductEvent(name, props); } catch (_) {}
}
const ALERT_TYPE_LABEL = { market_move: '市場の動き', important_event: '重要な出来事' };
function formatDateTime(iso) {
  if (!iso) return '';
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso));
  return m ? `${m[1]}年${Number(m[2])}月${Number(m[3])}日` : '';
}

const main = document.getElementById('app');
const params = new URLSearchParams(location.search);
const key = params.get('key');

function notFound() {
  main.innerHTML = `<p class="lead" style="padding-top:30px;">このAlertは見つかりませんでした。</p>
    <a class="back-link" href="alerts.html">← Marketcast Alert 一覧へ</a>`;
}

function gateBox(title, lead, links) {
  const linkHtml = links.map((l) =>
    `<a href="${esc(l.href)}"${l.secondary ? ' class="secondary"' : ''}>${esc(l.text)}</a>`
  ).join('');
  return `<div class="gate"><h2>${esc(title)}</h2><p>${esc(lead)}</p><div class="gate-links">${linkHtml}</div></div>`;
}

function renderBody(body, assetLabelOf) {
  const observed = (body.observed || []).map((o) =>
    `<div class="obs-item"><b>${esc(o.label)}</b>
      <span class="val">${esc(o.value)}</span>
      <span class="src">出典: ${esc(o.source)}${o.as_of ? '／' + esc(o.as_of) + '時点' : ''}</span></div>`
  ).join('');

  const meanings = (body.asset_meaning || []).map((m) =>
    `<div class="asset-row"><b>${esc(assetLabelOf(m.asset_key))}</b><p>${esc(m.text)}</p></div>`
  ).join('');

  return `
    <div class="sec-label">何が起きた？</div>
    <p class="what">${esc(body.what_happened || '')}</p>

    <div class="sec-label">市場では実際どう動いた？（Observed）</div>
    <div class="observed">${observed}</div>

    <div class="sec-label">気になる資産にはどういう意味？（Marketcast Analysis）</div>
    <p class="analysis-note">実際に観測された値動きではなく、一般的な市場構造から考えられる整理です。将来の値動きを示すものでも、特定の取引を推奨するものでもありません。</p>
    ${meanings}

    <div class="sec-label">なぜこの通知が届いたか</div>
    <p class="why">${esc(body.why || '')}</p>

    <div class="sec-label">詳しく見る</div>
    <div class="links-list">
      <a class="link-card" href="asset_impact.html"><b>資産影響分析</b><span>資産ごとに、複数の出来事を横断した傾向を整理しています。</span></a>
      <a class="link-card" href="weekly.html"><b>Marketcast Weekly</b><span>今週の市場全体の流れを確認できます。</span></a>
      <a class="link-card" href="current_context.html"><b>いまの市場を見る</b><span>現在の市場環境の観測値を確認できます。</span></a>
    </div>
  `;
}

(async () => {
  if (!key || !/^[a-z0-9-]{1,100}$/.test(key)) return notFound();

  if (typeof window !== 'undefined' && window.MEMBERSHIP_SUSPENDED) {
    main.innerHTML = gateBox(
      '会員機能を停止しています',
      'Marketcast Alertは有料プラン向けの機能です。現在は会員機能の提供を停止しているため表示できません。',
      [{ href: 'alerts.html', text: 'Alert一覧へ', secondary: true }]
    );
    return;
  }

  let supabase;
  try { ({ supabase } = await import('./assets/js/supabase-client.js')); } catch (_) { return notFound(); }

  // 資産の表示名は data/assets.json を正とする
  let assetLabelById = {};
  try {
    const res = await fetch('data/assets.json', { cache: 'no-store' });
    const json = await res.json();
    assetLabelById = Object.fromEntries((json.assets || []).map((a) => [a.id, a.label]));
  } catch (_) { /* フォールバックでkeyそのまま */ }
  const assetLabelOf = (assetKey) => assetLabelById[assetKey] || assetKey;

  // ── 1. free_preview を取得（未ログインでも表示可能） ──
  let preview = null;
  try {
    const url = `get-marketcast-alert?key=${encodeURIComponent(key)}`;
    const { data, error } = await supabase.functions.invoke(url, { method: 'GET' });
    if (!error && data && data.preview) preview = data.preview;
  } catch (_) { /* noop */ }

  if (!preview) return notFound();

  track('alert_open');

  const assets = (preview.affected_asset_keys || [])
    .map((k) => esc(assetLabelOf(k))).join('・');
  const headHtml = `
    <div class="eyebrow">Marketcast Alert</div>
    <h1>${esc(preview.title)}</h1>
    <div class="meta">
      <span class="badge">${esc(ALERT_TYPE_LABEL[preview.alert_type] || 'Alert')}</span>
      <span class="time">${esc(formatDateTime(preview.published_at))}</span>
    </div>
    <p class="lead">${esc((preview.free_preview || {}).summary || '')}</p>
    ${assets ? `<p class="lead" style="margin-top:8px;">関係する資産: ${assets}</p>` : ''}`;

  // ── 2. 認可状態を確認 ──
  let state = 'error';
  try {
    const mod = await import('./assets/js/subscription-state.js');
    ({ state } = await mod.getSubscriptionState());
  } catch (_) { state = 'error'; }

  if (state !== 'paid') {
    const COPY = {
      unauthenticated: ['ログインが必要です', 'ログインのうえPremiumプランをご利用いただくと、本文をご覧いただけます。',
        [{ href: 'login.html', text: 'ログインする' }, { href: 'pricing.html', text: 'Premiumプランを見る', secondary: true }]],
      free: ['Premiumプランでご覧いただけます', 'Marketcast Alertの本文はPremiumプラン向けのコンテンツです。',
        [{ href: 'pricing.html', text: 'Premiumプランを見る' }]],
      inactive: ['Premiumプランでご覧いただけます', 'Marketcast Alertの本文はPremiumプラン向けのコンテンツです。',
        [{ href: 'pricing.html', text: 'Premiumプランを見る' }]],
      attention: ['お支払い状況をご確認ください', 'ご契約の状態を確認できませんでした。',
        [{ href: 'account.html', text: 'アカウントを確認する' }]],
      error: ['現在ご利用いただけません', '契約状態を確認できませんでした。時間をおいて再度お試しください。',
        [{ href: 'alerts.html', text: 'Alert一覧へ', secondary: true }]],
    };
    const [title, lead, links] = COPY[state] || COPY.error;
    main.innerHTML = headHtml + gateBox(title, lead, links);
    return;
  }

  // ── 3. 本文取得（Premium認可通過） ──
  try {
    const { data, error } = await supabase.functions.invoke('get-marketcast-alert', {
      body: { key },
    });
    if (error || !data || !data.body) {
      main.innerHTML = headHtml + gateBox(
        '現在ご利用いただけません', '本文を読み込めませんでした。時間をおいて再度お試しください。',
        [{ href: 'alerts.html', text: 'Alert一覧へ', secondary: true }]
      );
      return;
    }
    main.innerHTML = headHtml + renderBody(data.body, assetLabelOf) +
      `<div class="disclaimer">${esc(data.disclaimer || '')}</div>
       <a class="back-link" href="alerts.html">← Marketcast Alert 一覧へ</a>`;
  } catch (_) {
    main.innerHTML = headHtml + gateBox(
      '現在ご利用いただけません', '本文を読み込めませんでした。時間をおいて再度お試しください。',
      [{ href: 'alerts.html', text: 'Alert一覧へ', secondary: true }]
    );
  }
})();
</script>
<script type="module" src="assets/js/auth-common.js"></script>
</body>
</html>
